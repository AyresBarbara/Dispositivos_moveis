<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 1
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large"></ion-title>
    </ion-toolbar>
  </ion-header>

  <!--<app-explore-container name="Tab 1 page"></app-explore-container> -->

  <ion-card>
    <ion-card-header></ion-card-header>
    <ion-card-content>
      <ion-input [(ngModel)]="valorInputCEP" counter="true" label="CEP" labelPlacment="floating" maxlength="8" placeholder="55.666-777"></ion-input>
      <ion-button (click)="consultarCEP()" expand="block"><ion-icon name="search" slot="start"></ion-icon> Pesquisar</ion-button>
      <ion-label>Rótulo</ion-label>
    </ion-card-content>
  </ion-card>
  
  <ion-card>
    <ion-card-header>
      <ion-card-title> Pokemon: {{pokemon.name}}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-img alt="imagem randomica" src="https://picsum.photos/536/354"></ion-img>
      <ion-list>
        <ion-item>
          <ion-label>1</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>2</ion-label>
        </ion-item>
        <ion-item>
          <ion-label>3</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>

  </ion-card>
  
</ion-content>
